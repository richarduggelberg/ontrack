<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnTrack – På spåret-förutsägelser</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d1117;
      color: #f0f6fc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    header h1 {
      margin: 0 0 0.25rem;
      font-size: 2rem;
      font-weight: 600;
    }
    header p {
      margin: 0;
      color: #8b949e;
      font-size: 0.95rem;
    }
    .columns {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .column {
      flex: 1 1 320px;
      max-width: 380px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.25rem 1.25rem;
    }
    .column h2 {
      font-size: 1.2rem;
      margin: 0 0 0.35rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #30363d;
    }
    .latest {
      margin: 0 0 1rem;
      color: #8b949e;
      font-size: 0.7rem;
    }
    ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid #21262d;
    }
    li:last-child { border-bottom: none; }
    .rank {
      color: #8b949e;
      font-variant-numeric: tabular-nums;
      width: 1.5rem;
      text-align: right;
      flex-shrink: 0;
    }
    .place {
      flex: 1;
      min-width: 0;
    }
    .place-name {
      display: block;
    }
    .meta {
      display: block;
      color: #8b949e;
      font-size: 0.75rem;
    }
    .pct {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #58a6ff;
      flex-shrink: 0;
    }
    .wildcards {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px dashed #30363d;
    }
    .wildcards h3 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .wildcards li {
      border-bottom: none;
      padding: 0.2rem 0;
    }
    .wildcards .place {
      color: #c9d1d9;
      font-size: 0.9rem;
    }
    .wildcards .pct {
      color: #8b949e;
      font-weight: 400;
      font-size: 0.8rem;
    }
    .status, footer {
      text-align: center;
      color: #8b949e;
      padding: 1rem;
      font-size: 0.85rem;
    }
    .bonus {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      padding: 0 1.5rem;
    }
    .bonus-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem 1.25rem 1.25rem;
    }
    .bonus-card h2 {
      font-size: 1.2rem;
      margin: 0 0 0.35rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #30363d;
    }
    .bonus-card .hint {
      margin: 0 0 1rem;
      color: #8b949e;
      font-size: 0.75rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .chips li {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      padding: 0.3rem 0.6rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 999px;
      font-size: 0.85rem;
      line-height: 1.2;
    }
    .chips .meta { font-size: 0.7rem; }
    .chips .tag {
      font-size: 0.65rem;
      color: #8b949e;
      padding-left: 0.35rem;
      border-left: 1px solid #30363d;
    }
  </style>
</head>
<body>
  <header>
    <h1>På spåret – nästa resmål</h1>
    <p>Rangordnade förutsägelser baserat på historiska resmål, uppdelat på Sverige, Europa och resten av världen.</p>
  </header>
  <div class="columns" id="columns">
    <p class="status">Laddar förutsägelser…</p>
  </div>
  <section class="bonus" id="bonus"></section>
  <footer id="footer"></footer>

  <script>
    const REGION_ORDER = ["sweden", "europe", "outside_europe"];

    function countryFlagEmoji(code) {
      // Regional indicator symbols; some OS emoji fonts (e.g. Windows) don't
      // have flag glyphs and will show the two letters/boxes instead.
      if (!code || code.length !== 2) return "";
      const points = [...code.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65);
      return String.fromCodePoint(...points);
    }

    function shortDate(isoDate) {
      if (!isoDate) return "";
      // Parse as local midnight so the day doesn't shift in negative offsets.
      const d = new Date(`${isoDate}T00:00:00`);
      if (Number.isNaN(d.getTime())) return isoDate;
      return d.toLocaleDateString("sv-SE", { day: "numeric", month: "short" });
    }

    function renderBonusDestinations(data) {
      const bonusEl = document.getElementById("bonus");
      bonusEl.innerHTML = "";
      const items = data.bonus_destinations;
      if (!items || !items.length) return;

      const card = document.createElement("div");
      card.className = "bonus-card";

      const h2 = document.createElement("h2");
      h2.textContent = "Senaste i bonussegmenten";
      card.appendChild(h2);

      const hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent =
        `De ${items.length} senaste resmålen från bonussegmenten (Närmast vinner / Tintin & Haddock) – de räknas inte in i förutsägelserna, men nollställer ändå karensen för ett resmål.`;
      card.appendChild(hint);

      const ul = document.createElement("ul");
      ul.className = "chips";
      items.forEach((item) => {
        const li = document.createElement("li");
        const flag = countryFlagEmoji(item.country_code);
        li.innerHTML = `
          <span class="place-name">${flag ? flag + " " : ""}${item.place}</span>
          <span class="meta">S${item.season}E${item.episode} · ${shortDate(item.date)}</span>
          <span class="tag">${item.segment}</span>
        `;
        ul.appendChild(li);
      });
      card.appendChild(ul);

      bonusEl.appendChild(card);
    }

    async function loadPredictions() {
      const columnsEl = document.getElementById("columns");
      const footerEl = document.getElementById("footer");
      try {
        const res = await fetch("data/predictions.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        columnsEl.innerHTML = "";
        for (const key of REGION_ORDER) {
          const region = data.regions[key];
          if (!region) continue;
          const col = document.createElement("div");
          col.className = "column";

          const h2 = document.createElement("h2");
          h2.textContent = region.label;
          col.appendChild(h2);

          if (region.latest && region.latest.length) {
            const latestEl = document.createElement("p");
            latestEl.className = "latest";
            latestEl.textContent = `Senaste: ${region.latest.join(" · ")}`;
            col.appendChild(latestEl);
          }

          const ol = document.createElement("ol");
          region.predictions.forEach((p, i) => {
            const li = document.createElement("li");
            li.innerHTML = `
              <span class="rank">${i + 1}.</span>
              <span class="place">
                <span class="place-name">${p.place}</span>
                <span class="meta">×${p.count} · ${p.episodes_since_last_seen} avsnitt sedan</span>
              </span>
              <span class="pct">${p.percentage}%</span>
            `;
            ol.appendChild(li);
          });
          col.appendChild(ol);

          if (region.wildcards && region.wildcards.length) {
            const wc = document.createElement("div");
            wc.className = "wildcards";
            const h3 = document.createElement("h3");
            h3.textContent = "Eller en nykomling?";
            wc.appendChild(h3);
            const wcOl = document.createElement("ol");
            region.wildcards.forEach((p) => {
              const li = document.createElement("li");
              li.innerHTML = `
                <span class="rank">★</span>
                <span class="place">${p.place}</span>
                <span class="pct">${countryFlagEmoji(p.country_code)}</span>
              `;
              wcOl.appendChild(li);
            });
            wc.appendChild(wcOl);
            col.appendChild(wc);
          }

          columnsEl.appendChild(col);
        }

        renderBonusDestinations(data);

        footerEl.textContent =
          `Baserat på ${data.episode_count} avsnitt · uppdaterad ${new Date(data.generated_at).toLocaleString("sv-SE")}`;
      } catch (err) {
        columnsEl.innerHTML = `<p class="status">Kunde inte ladda förutsägelser (${err.message}).</p>`;
      }
    }

    loadPredictions();
  </script>
</body>
</html>
